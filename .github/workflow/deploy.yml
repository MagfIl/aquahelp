name: Generate Lock File

on:
  push:
    branches: 'main' #ondeploy

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Force generate package-lock
        # Используем старую стратегию генерации, чтобы обойти баг 'edgesOut'
        run: npm i --package-lock-only --legacy-peer-deps

      - name: Commit and Push package-lock.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate package-lock.json [skip ci]"
          file_pattern: 'package-lock.json'
