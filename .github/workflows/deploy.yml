name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' 
# Разрешаем скрипту управлять публикацией в GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем старые сборки, если новый пуш прилетел до того, как завершился прошлый деплой
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20 # Указываем актуальную версию Node.js
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite собирает проект в папку dist по умолчанию

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
